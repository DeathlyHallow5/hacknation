# TestLab proxy stack (compose.yaml, profile testlab): Traefik → Toxiproxy (latency etc.) → WordPress.
http:
  routers:
    wordpress:
      entryPoints:
        - web
      rule: PathPrefix(`/`)
      service: wordpress-service

  services:
    wordpress-service:
      loadBalancer:
        servers:
          - url: "http://tl-toxiproxy:8666"
