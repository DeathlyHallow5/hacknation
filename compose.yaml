# ASI — everything in one file:
#
#   docker compose up -d --build                      site + DefectDojo + test lab (172.30.0.0/24)
#   docker compose --profile testlab up -d            + TestLab: WordPress, phpMyAdmin, Redis, FTP, DVWA,
#                                                     Gitea, PostgreSQL, RabbitMQ… (several GB of images)
#   docker compose --profile lab2 up -d lab-admin     "infrastructure change" for the 2nd demo scan
#   docker compose --profile testlab --profile lab2 down
#
#   Dashboard  http://localhost:3000   admin / ASI_ADMIN_PASSWORD from .env
#   DefectDojo http://localhost:8081   admin / DD_ADMIN_PASSWORD from .env
#
# Only those two ports are published (127.0.0.1). The core, the databases and every lab service
# live on internal Docker networks with no way out; the scanner reaches only the lab network and
# only what ASI_ALLOWED_CIDRS / ASI_ALLOWED_PORTS allow. Production: compose.production.yaml.
name: asi

x-dojo-image: &dojo-image "docker.io/defectdojo/defectdojo-django:${DD_VERSION:-3.4.304}"
x-dojo-env: &dojo-env
  DD_DATABASE_URL: postgresql://defectdojo:${DD_DATABASE_PASSWORD:?set DD_DATABASE_PASSWORD in .env (see README)}@dojo-postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://dojo-valkey:6379/0
  DD_CACHE_URL: redis://dojo-valkey:6379/1
  DD_SECRET_KEY: ${DD_SECRET_KEY:?set DD_SECRET_KEY in .env (see README)}
  DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?set DD_CREDENTIAL_AES_256_KEY in .env (see README)}
  DD_DATABASE_HOST: dojo-postgres
  DD_DATABASE_PORT: "5432"
  DD_DATABASE_READINESS_TIMEOUT: "60"
  DD_ALLOWED_HOSTS: localhost,127.0.0.1,dojo-nginx
  DD_CSRF_TRUSTED_ORIGINS: http://localhost:${DD_PORT:-8081},http://127.0.0.1:${DD_PORT:-8081}
x-dojo-wait: &dojo-wait
  dojo-initializer:
    condition: service_completed_successfully
  dojo-postgres:
    condition: service_started
  dojo-valkey:
    condition: service_started

services:
  # ---------------------------------------------------------------- ASI
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asi
      POSTGRES_USER: asi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U asi -d asi"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        BASE_REGISTRY: ${ASI_BASE_REGISTRY:-docker.io/library}
    init: true
    restart: unless-stopped
    # No host port: the core sits on internal networks only (no egress). Scripts that call the
    # core API directly (scripts/bench) need compose.api.yaml on top.
    environment:
      DATABASE_URL: postgres://asi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/asi
      ASI_DATA_KEY: ${ASI_DATA_KEY:?set ASI_DATA_KEY in .env (see .env.example)}
      ASI_ALLOWED_ORIGINS: ${ASI_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      ASI_GLOBAL_PPS: ${ASI_GLOBAL_PPS:-1000}
      ASI_STOP_FILE: /run/asi-control/STOP
      ASI_ALLOWED_PORTS: ${ASI_ALLOWED_PORTS:-22,80,443,3306,5432,6379,8080,8443}
      ASI_EXCLUDED_CIDRS: ${ASI_EXCLUDED_CIDRS:-}
      ASI_ALLOWED_CIDRS: ${ASI_ALLOWED_CIDRS:-172.30.0.0/24}
      # DNS names that may be targets (and their subdomains); each must resolve into the CIDRs above.
      ASI_ALLOWED_DOMAINS: ${ASI_ALLOWED_DOMAINS:-asi.test}
      ASI_MAX_RUNS: ${ASI_MAX_RUNS:-1}
      ASI_MAX_CONCURRENCY: ${ASI_MAX_CONCURRENCY:-256}
      ASI_ADMIN_USER: ${ASI_ADMIN_USER:-admin}
      ASI_ADMIN_PASSWORD: ${ASI_ADMIN_PASSWORD:-}
      ASI_SESSION_TTL_HOURS: ${ASI_SESSION_TTL_HOURS:-12}
      ASI_COOKIE_SECURE: ${ASI_COOKIE_SECURE:-false}
      DEFECTDOJO_URL: ${DEFECTDOJO_URL:-}
      DEFECTDOJO_TOKEN: ${DEFECTDOJO_TOKEN:-}
      # Links to DefectDojo in the dashboard (the core itself talks to http://dojo-nginx:8080).
      DEFECTDOJO_PUBLIC_URL: http://localhost:${DD_PORT:-8081}
    depends_on:
      db:
        condition: service_healthy
    volumes: [./deploy/control:/run/asi-control:ro]
    networks: [default, lab]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Dashboard (frontend/, Next.js). `proxy` sends every /api/v1 call to the Rust core;
  # ASI_API_MODE=mock runs it on its built-in demo data instead.
  web:
    build:
      context: ./frontend
      args:
        BASE_REGISTRY: ${ASI_BASE_REGISTRY:-docker.io/library}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASI_WEB_PORT:-3000}:3000"
    environment:
      ASI_API_MODE: ${ASI_API_MODE:-proxy}
      ASI_API_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    # `default` is internal (no egress, and Docker publishes no ports from it): `edge` carries
    # only the dashboard's published port. The core stays on internal networks.
    networks: [default, edge]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------- DefectDojo
  # Based on DefectDojo's own docker-compose.yml (release 3.4.304), with images from Docker Hub
  # (not registry.defectdojo.com, which logs each pull with the IP), secrets from .env instead
  # of the shared upstream defaults, and its own internal network: only nginx joins the core's
  # network (http://dojo-nginx:8080) and `edge` (the UI on http://localhost:8081).
  dojo-nginx:
    image: docker.io/defectdojo/defectdojo-nginx:${DD_VERSION:-3.4.304}
    restart: unless-stopped
    depends_on:
      dojo-uwsgi:
        condition: service_started
    environment:
      DD_UWSGI_HOST: dojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - dojo-media:/usr/share/nginx/html/media
    ports:
      - "127.0.0.1:${DD_PORT:-8081}:8080"
    networks: [dojo, default, edge]

  dojo-uwsgi:
    image: *dojo-image
    restart: unless-stopped
    depends_on: *dojo-wait
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-uwsgi.sh"]
    environment:
      <<: *dojo-env
      DD_DEBUG: "False"
    volumes:
      - dojo-media:/app/media
    networks: [dojo]

  dojo-celerybeat:
    image: *dojo-image
    restart: unless-stopped
    depends_on: *dojo-wait
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-celery-beat.sh"]
    environment: *dojo-env
    networks: [dojo]

  dojo-celeryworker:
    image: *dojo-image
    restart: unless-stopped
    depends_on: *dojo-wait
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-celery-worker.sh"]
    environment: *dojo-env
    volumes:
      - dojo-media:/app/media
    networks: [dojo]

  dojo-initializer:
    image: *dojo-image
    depends_on:
      dojo-postgres:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *dojo-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?set DD_ADMIN_PASSWORD in .env (see README)}
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: ASI
      DD_INITIALIZE: "true"
    networks: [dojo]

  dojo-postgres:
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:?set DD_DATABASE_PASSWORD in .env (see README)}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - dojo-postgres:/var/lib/postgresql/data
    networks: [dojo]

  dojo-valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    volumes:
      - dojo-redis:/data
    networks: [dojo]

  # One-shot: once DefectDojo answers, gets the admin's API token and saves it in ASI
  # (Administracja → Integracje), with automatic export after each scan. Skips if ASI is
  # already connected, so it never overwrites settings changed in the dashboard.
  dojo-connect:
    image: ${ASI_BASE_REGISTRY:-docker.io/library}/python:3.13-alpine
    restart: "no"
    depends_on:
      core:
        condition: service_healthy
      dojo-nginx:
        condition: service_started
    environment:
      ASI_ADMIN_USER: ${ASI_ADMIN_USER:-admin}
      ASI_ADMIN_PASSWORD: ${ASI_ADMIN_PASSWORD:-}
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?set DD_ADMIN_PASSWORD in .env (see README)}
    volumes: [./scripts/defectdojo/setup.py:/setup.py:ro]
    command: [python, -I, /setup.py, --dojo, "http://dojo-nginx:8080", --asi, "http://core:8000",
              --origin, "http://localhost:3000", --wait, "900", --keep]
    networks: [default]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------- test lab (172.30.0.0/24)
  # Isolated network the scanner may reach; names in the asi.test zone are domain targets.
  lab-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.10
        aliases: [www.asi.test]
  lab-httpd:
    image: httpd:2.4-alpine
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.11
        aliases: [intranet.asi.test]
  # A small CMS site for the signature demo: meta generator and version in the footer (html
  # signatures), X-Powered-By (header), and paths the built-in path signatures probe:
  # an exposed /.git/HEAD, /version, /login with a password form, /admin/.
  lab-cms:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        H=/usr/share/nginx/html
        mkdir -p $$H/.git $$H/admin
        echo '<!doctype html><html><head><title>Blog Wydzialu - CBI</title><meta name="generator" content="WordPress 6.4.2"></head><body><h1>Aktualnosci</h1><footer>Powered by WordPress 6.4.2</footer></body></html>' > $$H/index.html
        echo 'ref: refs/heads/main' > $$H/.git/HEAD
        echo '1.4.2' > $$H/version
        echo '<html><head><title>Logowanie</title></head><body><form method="post"><input name="user"><input type="password" name="pass"></form></body></html>' > $$H/login.html
        echo '<html><head><title>Panel administracyjny</title></head><body>Zaloguj</body></html>' > $$H/admin/index.html
        echo 'server { listen 80; root /usr/share/nginx/html; add_header X-Powered-By "PHP/8.1.2" always; location = /version { default_type text/plain; } location = /login { default_type text/html; try_files /login.html =404; } location /.git/ { default_type text/plain; } }' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    networks:
      lab:
        ipv4_address: 172.30.0.13
        aliases: [blog.asi.test]
  # "Infrastructure change" for the 2nd demo run (docker compose --profile lab2 up -d lab-admin):
  # a new host exposing an admin login on a staging page.
  lab-admin:
    profiles: [lab2]
    image: nginx:1.27-alpine
    command:
      - sh
      - -c
      - >-
        printf '<html><head><title>Admin login - staging</title></head><body>Panel administracyjny</body></html>'
        > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
    networks:
      lab:
        ipv4_address: 172.30.0.12
        aliases: [admin.staging.asi.test]

  # ---------------------------------------------------------------- TestLab (profile testlab)
  # The team's test stacks, moved onto the lab network so ASI can scan them: no host ports,
  # fixed addresses 172.30.0.20–.44. Passwords below are lab-only (internal network, never
  # published). Ports such as 21, 3000, 5672, 8474, 15672 are scanned only once added to
  # ASI_ALLOWED_PORTS.
  # Modern stack: WordPress + MariaDB, phpMyAdmin, Redis, Nginx Proxy Manager.
  tl-wordpress:
    profiles: [testlab]
    image: wordpress:6-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: tl-mariadb
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpresspass
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      tl-mariadb:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.0.20
        aliases: [wp.asi.test]
  tl-mariadb:
    profiles: [testlab]
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpresspass
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [tl-mariadb:/var/lib/mysql]
    networks:
      lab:
        ipv4_address: 172.30.0.21
        aliases: [db.asi.test]
  tl-phpmyadmin:
    profiles: [testlab]
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: tl-mariadb
    networks:
      lab:
        ipv4_address: 172.30.0.22
        aliases: [pma.asi.test]
  tl-redis:
    profiles: [testlab]
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [tl-redis:/data]
    networks:
      lab:
        ipv4_address: 172.30.0.23
        aliases: [redis.asi.test]
  tl-proxy-manager:
    profiles: [testlab]
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    volumes: [tl-npm:/data, tl-npm-certs:/etc/letsencrypt]
    networks:
      lab:
        ipv4_address: 172.30.0.24
        aliases: [proxy.asi.test]
  # Proxy stack: Traefik → Toxiproxy (optional latency) → the WordPress above.
  tl-traefik:
    profiles: [testlab]
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    volumes: [./deploy/lab/traefik:/etc/traefik/dynamic:ro]
    depends_on: [tl-toxiproxy]
    networks:
      lab:
        ipv4_address: 172.30.0.25
        aliases: [traefik.asi.test]
  tl-toxiproxy:
    profiles: [testlab]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      lab:
        ipv4_address: 172.30.0.26
  tl-toxiproxy-init:
    profiles: [testlab]
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      tl-toxiproxy:
        condition: service_healthy
    environment:
      # Extra latency on the proxied WordPress, in ms (0 = none): TL_LATENCY_MS=500 in .env.
      LATENCY_MS: ${TL_LATENCY_MS:-0}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        API=http://tl-toxiproxy:8474
        curl -fsS -X DELETE $$API/proxies/wordpress >/dev/null 2>&1 || true
        curl -fsS -X POST $$API/proxies -H 'Content-Type: application/json' \
          -d '{"name":"wordpress","listen":"0.0.0.0:8666","upstream":"tl-wordpress:80"}' >/dev/null
        if [ "$$LATENCY_MS" -gt 0 ]; then
          curl -fsS -X POST $$API/proxies/wordpress/toxics -H 'Content-Type: application/json' \
            -d "{\"name\":\"latency\",\"type\":\"latency\",\"stream\":\"downstream\",\"attributes\":{\"latency\":$$LATENCY_MS,\"jitter\":50}}" >/dev/null
        fi
        echo "toxiproxy: wordpress proxy ready (latency $$LATENCY_MS ms)"
    networks: [lab]
  # Vulnerable stack: WordPress 4.7 + MySQL 5.7, Adminer, FTP, DVWA.
  tl-wordpress-old:
    profiles: [testlab]
    image: wordpress:4.7
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: tl-mysql
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      tl-mysql:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.0.30
        aliases: [old.asi.test]
  tl-mysql:
    profiles: [testlab]
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      lab:
        ipv4_address: 172.30.0.31
  tl-adminer:
    profiles: [testlab]
    image: adminer:4
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.32
        aliases: [adminer.asi.test]
  tl-ftp:
    profiles: [testlab]
    image: fauria/vsftpd
    restart: unless-stopped
    environment:
      FTP_USER: test
      FTP_PASS: test123
      PASV_ADDRESS: 172.30.0.33
      PASV_MIN_PORT: 21000
      PASV_MAX_PORT: 21010
    networks:
      lab:
        ipv4_address: 172.30.0.33
        aliases: [ftp.asi.test]
  tl-dvwa:
    profiles: [testlab]
    image: vulnerables/web-dvwa
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.34
        aliases: [dvwa.asi.test]
  # Services stack: httpbin API, PostgreSQL, RabbitMQ, Gitea, a plain web app.
  tl-httpbin:
    profiles: [testlab]
    image: kennethreitz/httpbin
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.40
        aliases: [api.asi.test]
  tl-postgres:
    profiles: [testlab]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: StrongPassword123
    networks:
      lab:
        ipv4_address: 172.30.0.41
  tl-rabbitmq:
    profiles: [testlab]
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.42
        aliases: [mq.asi.test]
  tl-gitea:
    profiles: [testlab]
    image: gitea/gitea:1.22
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.43
        aliases: [git.asi.test]
  tl-webapp:
    profiles: [testlab]
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      lab:
        ipv4_address: 172.30.0.44
        aliases: [app.asi.test]

networks:
  default:
    internal: true
  edge: {}
  dojo:
    internal: true
  lab:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  dojo-postgres:
  dojo-media:
  dojo-redis:
  tl-mariadb:
  tl-redis:
  tl-npm:
  tl-npm-certs:
