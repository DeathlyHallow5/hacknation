name: asi

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asi
      POSTGRES_USER: asi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U asi -d asi"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        BASE_REGISTRY: ${ASI_BASE_REGISTRY:-docker.io/library}
    init: true
    restart: unless-stopped
    # No host port: the core sits on internal networks only (no egress). Scripts that call the
    # core API directly (scripts/*.sh, scripts/bench) need compose.api.yaml on top.
    environment:
      DATABASE_URL: postgres://asi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/asi
      ASI_DATA_KEY: ${ASI_DATA_KEY:?set ASI_DATA_KEY in .env (see .env.example)}
      ASI_ALLOWED_ORIGINS: ${ASI_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      ASI_GLOBAL_PPS: ${ASI_GLOBAL_PPS:-1000}
      ASI_STOP_FILE: /run/asi-control/STOP
      ASI_ALLOWED_PORTS: ${ASI_ALLOWED_PORTS:-22,80,443,3306,5432,6379,8080,8443}
      ASI_EXCLUDED_CIDRS: ${ASI_EXCLUDED_CIDRS:-}
      ASI_ALLOWED_CIDRS: ${ASI_ALLOWED_CIDRS:-172.30.0.0/24}
      # DNS names that may be targets (and their subdomains); each must resolve into the CIDRs above.
      ASI_ALLOWED_DOMAINS: ${ASI_ALLOWED_DOMAINS:-asi.test}
      ASI_MAX_RUNS: ${ASI_MAX_RUNS:-1}
      ASI_MAX_CONCURRENCY: ${ASI_MAX_CONCURRENCY:-256}
      ASI_ADMIN_USER: ${ASI_ADMIN_USER:-admin}
      ASI_ADMIN_PASSWORD: ${ASI_ADMIN_PASSWORD:-}
      ASI_SESSION_TTL_HOURS: ${ASI_SESSION_TTL_HOURS:-12}
      ASI_COOKIE_SECURE: ${ASI_COOKIE_SECURE:-false}
      DEFECTDOJO_URL: ${DEFECTDOJO_URL:-}
      DEFECTDOJO_TOKEN: ${DEFECTDOJO_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes: [./deploy/control:/run/asi-control:ro]
    networks: [default, lab]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Dashboard (frontend/, Next.js). `proxy` sends every /api/v1 call to the Rust core;
  # ASI_API_MODE=mock runs it on its built-in demo data instead.
  web:
    build:
      context: ./frontend
      args:
        BASE_REGISTRY: ${ASI_BASE_REGISTRY:-docker.io/library}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASI_WEB_PORT:-3000}:3000"
    environment:
      ASI_API_MODE: ${ASI_API_MODE:-proxy}
      ASI_API_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    # `default` is internal (no egress, and Docker publishes no ports from it): `edge` carries
    # only the dashboard's published port. The core stays on internal networks.
    networks: [default, edge]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Local test lab (docker compose --profile lab up): sample services on an isolated
  # network so we can demo >=2 scan runs and change detection without touching real hosts.
  lab-nginx:
    profiles: [lab]
    image: nginx:1.27-alpine
    networks:
      lab:
        ipv4_address: 172.30.0.10
        # Lab DNS names (Docker resolves them on the lab network): domain targets in the demo.
        aliases: [www.asi.test]
  lab-httpd:
    profiles: [lab]
    image: httpd:2.4-alpine
    networks:
      lab:
        ipv4_address: 172.30.0.11
        aliases: [intranet.asi.test]
  # A small CMS site for the signature demo: meta generator and version in the footer (html
  # signatures), X-Powered-By (header), and paths the built-in path signatures probe:
  # an exposed /.git/HEAD, /version, /login with a password form, /admin/.
  lab-cms:
    profiles: [lab]
    image: nginx:1.27-alpine
    command:
      - sh
      - -c
      - |
        H=/usr/share/nginx/html
        mkdir -p $$H/.git $$H/admin
        echo '<!doctype html><html><head><title>Blog Wydzialu - CBI</title><meta name="generator" content="WordPress 6.4.2"></head><body><h1>Aktualnosci</h1><footer>Powered by WordPress 6.4.2</footer></body></html>' > $$H/index.html
        echo 'ref: refs/heads/main' > $$H/.git/HEAD
        echo '1.4.2' > $$H/version
        echo '<html><head><title>Logowanie</title></head><body><form method="post"><input name="user"><input type="password" name="pass"></form></body></html>' > $$H/login.html
        echo '<html><head><title>Panel administracyjny</title></head><body>Zaloguj</body></html>' > $$H/admin/index.html
        echo 'server { listen 80; root /usr/share/nginx/html; add_header X-Powered-By "PHP/8.1.2" always; location = /version { default_type text/plain; } location = /login { default_type text/html; try_files /login.html =404; } location /.git/ { default_type text/plain; } }' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    networks:
      lab:
        ipv4_address: 172.30.0.13
        aliases: [blog.asi.test]
  # "Infrastructure change" for the 2nd demo run (docker compose --profile lab2 up -d):
  # a new host exposing an admin login on a staging page.
  lab-admin:
    profiles: [lab2]
    image: nginx:1.27-alpine
    command:
      - sh
      - -c
      - >-
        printf '<html><head><title>Admin login - staging</title></head><body>Panel administracyjny</body></html>'
        > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
    networks:
      lab:
        ipv4_address: 172.30.0.12
        aliases: [admin.staging.asi.test]

networks:
  default:
    internal: true
  edge: {}
  lab:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
