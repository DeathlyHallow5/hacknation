# Local DefectDojo for the ASI integration (export of findings via /api/v2/import-scan/).
#
#   docker compose -f compose.yaml -f compose.defectdojo.yaml --profile lab --profile dojo up -d
#   python scripts/defectdojo/setup.py .env        # token, product, engagement → ASI settings
#
# Based on DefectDojo's own docker-compose.yml (release 3.4.304), with:
# - images from Docker Hub (not registry.defectdojo.com, which logs each pull with the IP);
# - secrets from .env instead of the shared defaults of the upstream file;
# - its own internal network; only nginx joins the core's network (so the core reaches
#   http://dojo-nginx:8080) and `edge` (the UI on http://localhost:8081).
x-dojo-image: &dojo-image "docker.io/defectdojo/defectdojo-django:${DD_VERSION:-3.4.304}"
x-dojo-env: &dojo-env
  DD_DATABASE_URL: postgresql://defectdojo:${DD_DATABASE_PASSWORD:?set DD_DATABASE_PASSWORD in .env}@dojo-postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://dojo-valkey:6379/0
  DD_CACHE_URL: redis://dojo-valkey:6379/1
  DD_SECRET_KEY: ${DD_SECRET_KEY:?set DD_SECRET_KEY in .env}
  DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?set DD_CREDENTIAL_AES_256_KEY in .env}
  DD_DATABASE_HOST: dojo-postgres
  DD_DATABASE_PORT: "5432"
  DD_DATABASE_READINESS_TIMEOUT: "60"
  DD_ALLOWED_HOSTS: localhost,127.0.0.1,dojo-nginx
  DD_CSRF_TRUSTED_ORIGINS: http://localhost:${DD_PORT:-8081},http://127.0.0.1:${DD_PORT:-8081}
x-dojo-wait: &dojo-wait
  dojo-initializer:
    condition: service_completed_successfully
  dojo-postgres:
    condition: service_started
  dojo-valkey:
    condition: service_started

services:
  # The core reaches DefectDojo as http://dojo-nginx:8080 (set in Administracja → Integracje);
  # links in the dashboard use the address the browser can open.
  core:
    environment:
      DEFECTDOJO_PUBLIC_URL: http://localhost:${DD_PORT:-8081}

  dojo-nginx:
    profiles: [dojo]
    image: docker.io/defectdojo/defectdojo-nginx:${DD_VERSION:-3.4.304}
    restart: unless-stopped
    depends_on:
      dojo-uwsgi:
        condition: service_started
    environment:
      DD_UWSGI_HOST: dojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - dojo-media:/usr/share/nginx/html/media
    ports:
      - "127.0.0.1:${DD_PORT:-8081}:8080"
    networks: [dojo, default, edge]

  dojo-uwsgi:
    profiles: [dojo]
    image: *dojo-image
    restart: unless-stopped
    depends_on: *dojo-wait
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-uwsgi.sh"]
    environment:
      <<: *dojo-env
      DD_DEBUG: "False"
    volumes:
      - dojo-media:/app/media
    networks: [dojo]

  dojo-celerybeat:
    profiles: [dojo]
    image: *dojo-image
    restart: unless-stopped
    depends_on: *dojo-wait
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-celery-beat.sh"]
    environment: *dojo-env
    networks: [dojo]

  dojo-celeryworker:
    profiles: [dojo]
    image: *dojo-image
    restart: unless-stopped
    depends_on: *dojo-wait
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-celery-worker.sh"]
    environment: *dojo-env
    volumes:
      - dojo-media:/app/media
    networks: [dojo]

  dojo-initializer:
    profiles: [dojo]
    image: *dojo-image
    depends_on:
      dojo-postgres:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "dojo-postgres:5432", "-t", "60", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *dojo-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?set DD_ADMIN_PASSWORD in .env}
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: ASI
      DD_INITIALIZE: "true"
    networks: [dojo]

  dojo-postgres:
    profiles: [dojo]
    image: docker.io/library/postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:?set DD_DATABASE_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - dojo-postgres:/var/lib/postgresql/data
    networks: [dojo]

  dojo-valkey:
    profiles: [dojo]
    image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    volumes:
      - dojo-redis:/data
    networks: [dojo]

networks:
  dojo:
    internal: true

volumes:
  dojo-postgres:
  dojo-media:
  dojo-redis:
